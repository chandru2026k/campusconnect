spring:
  application:
    name: campusconnect-backend
  datasource:
    url: jdbc:h2:mem:campusdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day

campusconnect:
  email:
    allowed-domain: college.edu
  auth:
    google:
      client-id: 730057113534-2oiap6bvui7rb4orreg6r0mdlofpdu2u.apps.googleusercontent.com
    allowed-domains: citchennai.net,college.edu,gmail.com
